name: Publish package to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'gradle'
      # build project
      - name: Build with Gradle
        run: ./gradlew --no-daemon build
  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      publish-start-time: ${{ steps.set-start-time.outputs.time }}
      publish-end-time: ${{ steps.set-end-time.outputs.time }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Set publish start time
        id: set-start-time
        run: echo "time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Get current version from tag
        id: get-version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"
      # Setup JDK
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'gradle'
      # Publish Package
      - name: Publish libraries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon publish

      - name: Set publish end time
        id: set-end-time
        run: echo "time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
      # Always upload the gradle problems report
      - name: Upload Gradle problems report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-problems-report
          path: build/reports/problems/
  create-change-log:
    needs: publish
    name: Create and publish change log
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run changelog cli action
        uses: monta-app/changelog-cli-action@main
        with:
          service-name: "OCPP Library"
          github-release: true
          github-token: ${{ secrets.MONTA_GITHUB_TOKEN }}
          jira-app-name: "montaapp"
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          version-mode: "SemVer"
          output: "slack"
          slack-token: ${{ secrets.SLACK_APP_TOKEN }}
          slack-channels: "#info-releases,#service-ocpp"
          # Metadata for PR/JIRA comments
          stage: "production"
          deployment-start-time: ${{ needs.publish.outputs.publish-start-time }}
          deployment-end-time: ${{ needs.publish.outputs.publish-end-time }}
          deployment-url: "https://github.com/monta-app/library-ocpp/releases/tag/v${{ needs.publish.outputs.version }}"
          comment-on-prs: true
          comment-on-jira: true
